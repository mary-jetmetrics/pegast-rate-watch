name: Бот курса — команды

# Обрабатывает команду /завтра из Telegram. Actions не «слушает» чат, поэтому раз в
# несколько минут забираем накопившиеся сообщения через getUpdates (bot.py --once),
# отвечаем и коммитим bot_offset.txt — до какого сообщения уже ответили. Отсюда и
# задержка ответа: до интервала крона. Мгновенно было бы только со всегда-живым
# хостом, от него отказались в пользу «всё внутри GitHub».
#
# Раз в 5 минут — минимально частый крон, который разрешает GitHub. По факту Actions
# может запускаться реже и с опозданием: гарантий по времени у расписаний нет.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Два прогона разом не нужны и подрались бы на getUpdates (Telegram отдаёт очередь
# только одному) и на коммите offset. Лишний запуск отменяем.
concurrency:
  group: tg-bot
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Разгрести команды
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 bot.py --once

      - name: Сохранить offset
        run: |
          if [[ -n "$(git status --porcelain bot_offset.txt)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bot_offset.txt
            git commit -m "Бот: offset $(cat bot_offset.txt)"
            git push
          else
            echo "Новых команд не было"
          fi
